[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retain-memory"
version = "0.1.0"
description = "A small CLI and MCP server for categorized memory retention"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["cli", "mcp", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=1.12,<2",
]

[project.scripts]
retain = "retain_memory.cli:main"
retain-mcp = "retain_memory.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retain_memory"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
